[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-audit"
version = "1.0.0"
description = "Tamper-evident, Ed25519-signed Merkle audit logs for AI agent execution."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
urls = { Homepage = "https://github.com/Khizar226/aegis-audit" }
keywords = ["security", "audit-log", "merkle-tree", "ed25519", "ai-agents", "tamper-evident"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = ["typer>=0.12", "rich>=13.0", "cryptography>=42", "typing_extensions>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aegis-audit = "aegis_audit.cli:run"

[tool.setuptools]
packages = ["aegis_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
